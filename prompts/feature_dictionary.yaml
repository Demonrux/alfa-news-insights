# Словарь признаков df_Uid_data_hack.csv → человеческие формулировки для портрета компании.
# Используется prompts/pe/domain/company.py. Значения градаций (возраст, численность, стадия) берутся как есть из датасета:
# после EDA дополните блок value_labels, если коды в данных не читаются человеком.

flags:
  # признак-флаг → (что говорим при 1, что говорим при 0)
  CL_PRODUCT_RKO_MARK: {label: "расчётно-кассовое обслуживание", if_true: "обслуживается в банке (РКО)", if_false: "РКО в банке нет"}
  CL_PRODUCT_LOA_MARK: {label: "кредиты", if_true: "использует кредитные продукты", if_false: "кредитов в банке нет"}
  CL_PRODUCT_LEA_MARK: {label: "лизинг", if_true: "использует лизинг", if_false: "лизинга в банке нет"}
  CL_PRODUCT_DEP_MARK: {label: "депозиты", if_true: "размещает средства на депозитах", if_false: "депозитов в банке нет"}
  CL_PRODUCT_GAR_MARK: {label: "банковские гарантии", if_true: "использует банковские гарантии", if_false: "гарантий в банке нет"}
  CL_PRODUCT_ZPP_MARK: {label: "зарплатный проект", if_true: "есть зарплатный проект", if_false: "зарплатного проекта в банке нет"}
  FACTORING_MARK: {label: "факторинг", if_true: "использует факторинг", if_false: "факторинга нет"}
  FTS_FLAG: {label: "ВЭД", if_true: "ведёт внешнеэкономическую деятельность (есть в базе ФТС)", if_false: "сведений о ВЭД нет"}
  NEGATIVEMARK: {label: "данные о ключевом собственнике", if_true: "в банке есть достоверные данные о ключевом собственнике", if_false: "достоверных данных о ключевом собственнике в банке нет"}

categorical:
  ORG_TYPE: "тип организации"
  OKFS_NAME: "форма собственности"
  COMPANY_AGE_YEARS_GRADATION: "возраст компании"
  ECO_MARK_LABEL: "стадия развития бизнеса"
  AMOUNT_WORKERS_FNS_GRADATION: "численность по данным ФНС"
  AMOUNT_WORKERS_SPARK_GRADATION: "численность по данным СПАРК"
  CL_TYPE: "статус клиента"
  REGION: "регион регистрации"
  CITY: "город регистрации"
  FTS_COUNTRY_NAME: "страна по данным ФТС"

# Выручку в LLM не передаём точной суммой: только диапазон.
# Уточнение экспертов (Q&A 20.10.2026): REVENUE_COMPANY — выручка за 2025 год, в рублях.
# Значения 1000, 0 и пустые — технические заглушки, считаем «нет данных».
# Крупный бизнес определяется по ГРУППЕ компаний: совокупная выручка свыше 15 млрд руб.
revenue:
  revenue_unit_rub: 1
  year: 2025
  stub_max_rub: 1000           # всё, что ≤ этого значения, — заглушка
  large_business_bln_rub: 15
  bands_bln_rub:               # границы диапазонов, млрд руб.
    - [0, 15, "до 15 млрд руб."]
    - [15, 50, "15–50 млрд руб."]
    - [50, 150, "50–150 млрд руб."]
    - [150, 500, "150–500 млрд руб."]
    - [500, null, "свыше 500 млрд руб."]

# Значения, которые трактуем как «да» и «нет» для флагов
truthy: ["1", "1.0", "true", "True", "Y", "y", "да", "Да"]
falsy: ["0", "0.0", "false", "False", "N", "n", "нет", "Нет"]

# Подписи для градаций, если в данных коды. Заполнить после EDA, например:
# value_labels:
#   AMOUNT_WORKERS_FNS_GRADATION: {"1": "до 100", "2": "100–250", "3": "250–1000", "4": "свыше 1000"}
value_labels:
  CL_TYPE: {"Client": "действующий клиент", "Prospect": "потенциальный клиент", "Close Client": "бывший клиент"}

# Сервис только для действующих клиентов (Q&A 20.10.2026)
active_client_values: ["Client", "действующий клиент"]

