# Тест-кейсы P4, P5, P7, P8, P12, P13: пара «событие × компания» + эталонная карточка.
# Компании и статьи СИНТЕТИЧЕСКИЕ (поля как в df_Uid_data_hack.csv). Тезисы ЦМИ — настоящие, из prompts/thesis_registry.csv.
#
# Поля кейса — см. prompts/pe/app/context.py. Дополнительно:
#   reference       — эталонная карточка (проходит автопроверку; служит few-shot и mock-ответом)
#   bad_draft       — заведомо плохая карточка для проверки критика (P7) и исправления (P8)
#   expect          — проверки ответа P5/P8
#   expect_plan     — проверки P4
#   expect_critic   — ожидаемый итог критика для reference и bad
#   chat            — вопросы для P12

kind: p5
defaults: &rate_event
  title: "Банк России сохранил ключевую ставку на уровне 14%"
  event_date: "2026-09-11"
  is_business_relevant: true
  irrelevance_reason: null
  geography: {scope: russia, regions: [], countries: []}
  factors:
    - {code: KEY_RATE, direction: stable, is_primary: true, evidence: "сохранить ключевую ставку на уровне 14% годовых"}
    - {code: INFLATION, direction: up, is_primary: false, evidence: "ускорение роста цен в устойчивых компонентах до 5–6%"}
  commodities: []
  okved_hints: []
  actors: [{name: "Банк России", type: regulator}]
  key_facts:
    - {fact: "Ключевая ставка сохранена на уровне 14% годовых", numbers: [{value: 14, unit: "%", what: "ключевая ставка"}], status: confirmed}
    - {fact: "Устойчивая инфляция ускорилась до 5–6%", numbers: [{value: 5, unit: "%", what: "нижняя граница"}, {value: 6, unit: "%", what: "верхняя граница"}], status: confirmed}
    - {fact: "Следующее заседание — 23 октября", numbers: [], status: confirmed}
  horizon: short
  uncertainty_flags: []

rate_article: &rate_article
  id: "s001"
  source: "synthetic"
  published_at: "2026-09-11"
  title: "Банк России сохранил ключевую ставку на уровне 14%"
  text: >-
    Совет директоров Банка России 11 сентября принял решение сохранить ключевую ставку на уровне 14% годовых.
    В пресс-релизе регулятор указал на ускорение роста цен в устойчивых компонентах до 5–6% и на то, что
    проинфляционные риски выросли. Глава ЦБ на пресс-конференции пояснила, что совет директоров обсуждал только
    вариант паузы. Следующее заседание по ставке запланировано на 23 октября.

