# Таксономия факторов влияния.
# Источник правды для P1 (классификация), матрицы «признак → фактор», ранжирования и UI-фильтров.
# Коды неизменны: на них ссылаются схемы, реестр тезисов и код ML.

version: 1
directions: [up, down, stable, mixed, unclear]

factors:
  - code: KEY_RATE
    name: Ключевая ставка и ДКП
    includes: Решения и сигналы Банка России по ключевой ставке, риторика, прогнозы ставки, макропруденциальная политика ЦБ в части ставок.
    excludes: Ставки по конкретным кредитам и облигациям (→ CREDIT_DEBT_MARKET).
    direction_hint: "up — повышение или ужесточение сигнала; down — снижение или смягчение; stable — сохранение"
    examples:
      - ЦБ сохранил ключевую ставку на уровне 14%
      - Глава ЦБ допустила паузу в снижении ставки до конца года
    reports: [R_RATE, R_BOND, R_STRAT]

  - code: INFLATION
    name: Инфляция
    includes: Недельная и месячная инфляция, базовая и устойчивая инфляция, инфляционные ожидания населения и бизнеса, цены на группы потребительских товаров и услуг.
    excludes: Биржевые цены на сырьё (→ COMMODITIES).
    direction_hint: "up — ускорение инфляции или рост ожиданий"
    examples:
      - Росстат зафиксировал недельную дефляцию 0,01%
      - Инфляционные ожидания населения выросли до 14,7%
    reports: [R_INFL, R_RATE, R_CONS]

  - code: FX
    name: Курс рубля
    includes: Курс рубля к доллару и юаню, волатильность, валютный контроль, продажа валютной выручки.
    excludes: Санкции как таковые (→ SANCTIONS_TRADE).
    direction_hint: "up — ослабление рубля (рост курса руб./$); down — укрепление рубля"
    examples:
      - Рубль ослаб до 90 за доллар
    reports: [R_RATE, R_1H26, R_INFL]

  - code: SANCTIONS_TRADE
    name: Санкции и внешняя торговля
    includes: Санкции, пошлины, экспортные и импортные ограничения, таможня, параллельный импорт, расчёты с иностранными контрагентами, объёмы экспорта и импорта.
    excludes: Внутренняя логистика (→ LOGISTICS).
    direction_hint: "up — ужесточение ограничений или рост барьеров"
    examples:
      - Введены новые ограничения на экспорт металлопроката
      - Импорт товаров за 5 месяцев вырос на 11%
    reports: [R_1H26, R_GOLD, R_7M26]

  - code: COMMODITIES
    name: Сырьё
    includes: Цены и объёмы нефти, нефтепродуктов, газа, металлов, золота, угля, удобрений, леса, агропродукции; цены на топливо как товар.
    excludes: Розничные потребительские цены в целом (→ INFLATION).
    direction_hint: "up — рост цен на сырьё"
    examples:
      - Золото скорректировалось до 4 400 долларов за унцию
      - Цены на бензин выросли на 0,91% за неделю
    reports: [R_GOLD, R_STRAT, R_INFL, R_STEEL]

  - code: TAX_REGULATION
    name: Налоги и регулирование
    includes: Налоговые изменения, отраслевое регулирование, тарифы, законопроекты, мораторий на банкротства, макропруденциальные лимиты для отдельных продуктов.
    excludes: Решение ЦБ по ключевой ставке (→ KEY_RATE).
    direction_hint: "up — ужесточение регулирования или рост налоговой нагрузки"
    examples:
      - С 1 октября ужесточаются макропруденциальные лимиты по автокредитам
    reports: [R_CONS, R_STRAT]

  - code: GOV_SPENDING
    name: Госрасходы и госзаказ
    includes: Федеральный бюджет, дефицит, госпрограммы, госзакупки, субсидии, нацпроекты, размещение ОФЗ как источник финансирования дефицита.
    excludes: Налоги (→ TAX_REGULATION).
    direction_hint: "up — рост расходов или дефицита"
    examples:
      - Минфин представит параметры трёхлетнего бюджета
      - Дефицит бюджета составил 5,8 трлн рублей
    reports: [R_RATE, R_STRAT, R_1H26]

  - code: CONSUMER_DEMAND
    name: Потребительский спрос
    includes: Розничные продажи, продажи автомобилей, потребительское кредитование, доходы и сбережения населения, спрос на услуги.
    excludes: Индекс потребительских цен (→ INFLATION).
    direction_hint: "up — ускорение спроса"
    examples:
      - Продажи новых легковых автомобилей в августе упали на 7%
    reports: [R_CONS, R_7M26, R_1H26]

  - code: LABOR_MARKET
    name: Рынок труда
    includes: Безработица, вакансии и резюме, дефицит кадров, номинальные и реальные зарплаты, зарплатные ожидания.
    excludes: Доходы населения как фактор спроса (→ CONSUMER_DEMAND).
    direction_hint: "up — рынок труда жёстче (рост зарплат, дефицит кадров)"
    examples:
      - Число вакансий на HeadHunter за лето выросло на 12%
    reports: [R_7M26, R_CONS, R_1H26]

  - code: CREDIT_DEBT_MARKET
    name: Кредитный и долговой рынок
    includes: Доходности ОФЗ и корпоративных облигаций, аукционы Минфина, условия кредитования, корпоративное кредитование, ликвидность банков, ставки денежного рынка, кредитные рейтинги.
    excludes: Решение по ключевой ставке (→ KEY_RATE).
    direction_hint: "up — удорожание заимствований (рост доходностей, ужесточение условий)"
    examples:
      - Доходность длинных ОФЗ выросла до 16,3%
      - Корпоративный кредитный портфель вырос на 1,3% за месяц
    reports: [R_BOND, R_STRAT, R_7M26]

  - code: ECONOMIC_GROWTH
    name: Рост экономики
    includes: ВВП, промышленное производство, инвестиции, деловая активность, сальдированный финансовый результат компаний.
    excludes: События одной отрасли (→ INDUSTRY_EVENT).
    direction_hint: "up — ускорение роста"
    examples:
      - Прогноз роста ВВП на 2026 год снижен до 0,1%
    reports: [R_1H26, R_7M26, R_STRAT]

  - code: LOGISTICS
    name: Логистика
    includes: Перевозки, тарифы РЖД, порты, маршруты, фрахт, склады, транспортная инфраструктура, страхование грузов.
    excludes: Санкционные ограничения (→ SANCTIONS_TRADE).
    direction_hint: "up — ухудшение условий логистики или рост её стоимости"
    examples:
      - Атака на склад маркетплейса повысила стоимость страхования
    reports: [R_7M26, R_STRAT, R_1H26]

  - code: INDUSTRY_EVENT
    name: Отраслевое событие
    includes: Событие, касающееся конкретной отрасли целиком (указывать okved_hints).
    excludes: Макрофакторы, затрагивающие все отрасли.
    direction_hint: "up — улучшение условий в отрасли; down — ухудшение"
    examples:
      - Лесопромышленники запросили мораторий на банкротства
      - Выпуск нефтепродуктов в июне упал на 21,7%
    reports: [R_STRAT, R_1H26, R_BOND]

  - code: REGIONAL_EVENT
    name: Региональное событие
    includes: "События в конкретном регионе: инфраструктура, ЧП, региональные меры поддержки и ограничения."
    excludes: Общероссийские события.
    direction_hint: "down — негативное событие для бизнеса в регионе"
    examples:
      - В регионе введён режим ЧС из-за паводка
    reports: []

  - code: CORPORATE_EVENT
    name: Событие у компании
    includes: Банкротство, дефолт, сделка, смена собственника, авария, иск, рейтинговое действие у конкретной компании.
    excludes: Отраслевые события (→ INDUSTRY_EVENT).
    direction_hint: "down — негативное событие для компании"
    examples:
      - Рейтинговое агентство подтвердило рейтинг компании на уровне ruAAA
    reports: [R_BOND]

# Правило выбора основного фактора: тот, без которого событие не имело бы смысла как новость.
# Пример: «ЦБ сохранил ставку, сославшись на рост устойчивой инфляции» → основной KEY_RATE, второй INFLATION.
