services:
  db:
    image: pgvector/pgvector:pg16
    container_name: alfa-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alfa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alfa"]
      interval: 5s
      timeout: 5s
      retries: 10

  init_db:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "python backend/scripts/load_data.py && python backend/app/main.py"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/alfa
      - TQDM_DISABLE=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/alfa
      - LLM_API_KEY=${LLM_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      init_db:
        condition: service_completed_successfully
    volumes:
      - ./data:/data

volumes:
  pgdata: